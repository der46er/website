                i: 'https://cdn.simpleicons.org/github/f0f0f0',
                scale: 'w-[30px] h-[30px]',
                hoverBorder: 'hover:border-zinc-300/80',
                hoverShadow: 'hover:shadow-[0_0_50px_-5px_rgba(212,212,216,0.4)]'
            }
        ];

        document.getElementById('socials-list').innerHTML = socials.map(s => {
            return `
                <a href="${s.u}" target="_blank" rel="noopener noreferrer" class="group relative glass-box rounded-[1.2rem] transition-all duration-300 ${s.hoverBorder} ${s.hoverShadow} active:scale-[0.99] p-3 flex items-center overflow-hidden">
                    <div class="shrink-0 w-12 h-12 rounded-xl ${s.c} flex items-center justify-center shadow-lg transition-transform group-hover:scale-105" style="${s.s}">
                        <img src="${s.i}" alt="${s.t}" class="${s.scale} object-contain">
                    </div>
                    <div class="ml-5 flex-grow text-left">
                        <h3 class="text-base sm:text-lg font-black italic tracking-wide text-[#f0f0f0] leading-none">${s.t}</h3>
                    </div>
                    <div class="text-zinc-700 group-hover:text-[#f0f0f0] transition-all transform group-hover:translate-x-1 mr-2">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${arrowUpRight}</svg>
                    </div>
                </a>
            `;
        }).join('');

        // Spotify Lanyard Realtime Fetcher
        async function fetchSpotify() {
            try {
                const res = await fetch('https://api.lanyard.rest/v1/users/964500222870945873');
                const data = await res.json();
                if (data.success && data.data.spotify) {
                    const sp = data.data.spotify;
                    document.getElementById('sp-song').innerText = sp.song;
                    document.getElementById('sp-artist').innerText = sp.artist;
                    document.getElementById('sp-cover').src = sp.album_art_url;
                    document.getElementById('sp-cover').classList.remove('hidden');
                    document.getElementById('sp-dot').classList.remove('hidden');
                    document.getElementById('sp-icon').classList.add('hidden');
                    document.getElementById('sp-cover').classList.add('animate-vinyl');
                } else {
                    document.getElementById('sp-song').innerText = 'Silence';
                    document.getElementById('sp-artist').innerText = '(Not listening to music at the moment)';
                    document.getElementById('sp-cover').classList.add('hidden');
                    document.getElementById('sp-dot').classList.add('hidden');
                    document.getElementById('sp-icon').classList.remove('hidden');
                    document.getElementById('sp-cover').classList.remove('animate-vinyl');
                }
            } catch (e) {}
        }
        fetchSpotify();
        setInterval(fetchSpotify, 15000);
    </script>
</body>
</html>
