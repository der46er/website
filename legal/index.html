        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/backgounds/waves-cyan-black.webp");

            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            opacity: 1;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100lvh;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
            pointer-events: none;

                },

                            body: "Jeder Nutzer trägt die volle Eigenverantwortung für alle Inhalte, Grafiken, JSON-Dateien oder Exporte, die clientseitig auf unseren Seiten generiert oder verarbeitet werden. Wir distanzieren uns von jeglichen Urheberrechtsverletzungen der Nutzer und stehen mit deren Inhalten in keinerlei Verbindung."
                        },

                            title: "Haftungsausschluss für Softwarefehler",
                            body: "Die Bereitstellung aller Web-Tools und Skripte erfolgt ohne Gewähr ('as is'). Wir übernehmen keinerlei Haftung für Fehlfunktionen, Software-Bugs, Datenverlust im lokalen Browser-Speicher oder technische Ausfälle."
                        },
                        {
                            title: "Änderungen & Fortlaufende Gültigkeit",
                            body: "Mit der Nutzung der Seiten und Bestätigung der Richtlinien stimmen Sie zu, dass diese Bestimmungen angepasst werden können. Die fortgesetzte Nutzung unserer Services nach einer Aktualisierung gilt als automatische Zustimmung zu den neuen Bedingungen."
                        },

                            body: "Es gilt ausschließlich österreichisches Recht unter Ausschluss des UN-Kaufrechts. Ausschließlicher Gerichtsstand für sämtliche Streitigkeiten ist Linz, Österreich."
                        }
                    ]
                }
            },
            en: {
                flag: "https://cdn.jsdelivr.net/gh/der46er/webseite@main/assets/flags/united-kingdom-flag.webp",
                alt: "UK Flag",
                scopeLabel: "Scope of Application",
                scopeDesc: "This legal framework and policy set applies to all services under the following domains:",
                title: "Legal Information",
                desc: "Legal Notice, Privacy Policy, and Terms of Use",
                cookieText: "We use cookies and Google Analytics to improve our website and analyze traffic. Do you accept the use of cookies?",
                cookieDecline: "Decline",
                cookieAccept: "Accept",
                impressum: {
                    heading: "1. Legal Notice",
                    sub: "Information required under § 5 Austrian E-Commerce Act (ECG) and media regulations:",
                    operatorLabel: "Operator",
                    courtLabel: "Jurisdiction",
                    contactLabel: "Contact",
                },
                privacy: {
                    heading: "2. Privacy Policy",
                    sections: [
                        {
                            title: "Hosting & Cloudflare Protection",
                            body: "This site is hosted via GitHub Pages and routed through Cloudflare DNS/security proxies for DDoS mitigation, caching, and network defense."
                        },
                        {
                            title: "Google Analytics & Local Storage",
                            body: "Google Analytics is only initialized after affirmative consent via our banner. User options, tool preferences, and dark mode states are stored strictly client-side inside HTML5 LocalStorage."
                        },
                        {
                            title: "Security Logging & Abuse Prevention",
                            body: "For platform defense, fraud detection, and the investigation of prohibited activity, select tools and API endpoints may log client IP addresses and timestamps. These logs are used purely for system security and are never sold or combined with external tracking."
                        },
                        {
                            title: "External Links Disclaimer",
                            body: "We feature external outbound links. Once you navigate off this domain, we retain no control over and assume no liability for third-party privacy frameworks, cookies, or data operations."
                        }
                    ]
                },
                terms: {
                    heading: "3. Terms of Use",
                    sections: [
                        {
                            title: "Acceptable Use & Prohibited Acts",
                            body: "You are prohibited from using our web utilities, scripts, or interfaces to upload, generate, or distribute malware, malicious exploits, or any media violating Austrian law. Automated safety scripts may reject illegal or malformed payloads."
                        },
                        {
                            title: "Copyright & User Liability",
                            body: "Users remain solely liable for files, images, configs, and JSON data they produce using our tools. We operate solely as client-side software providers, do not hold user files, and disclaim all affiliation with third-party intellectual property breaches committed by users."
                        },
                        {
                            title: "Limitation of Liability ('As Is')",
                            body: "All tools and web applications are provided strictly 'as is' without warranties of any kind. We assume no liability for bugs, data loss in browser storage, or downtime."
                        },
                        {
                            title: "Policy Updates & Continued Use",
                            body: "We reserve the right to revise these policies. Continued access or usage of this website constitutes automated acceptance of any future adjustments or revised terms."

                            body: "All claims and disputes are governed exclusively by the laws of Austria. Exclusive territorial jurisdiction lies with the competent court in Linz, Austria."

                }
            }
        };

        let currentLang = localStorage.getItem('siteLang') || 'en';

        function render() {
            const t = translations[currentLang];
            
            document.getElementById('scope-label').textContent = t.scopeLabel;
            document.getElementById('scope-desc').textContent = t.scopeDesc;
            document.getElementById('legal-title').textContent = t.title;
            document.getElementById('legal-desc').textContent = t.desc;
            
            const langBtn = document.getElementById('lang-indicator');
            langBtn.innerHTML = '';
            const img = document.createElement('img');
            img.src = t.flag;
            img.alt = t.alt;
            img.className = 'w-7 h-auto rounded-md shadow-md object-cover opacity-80 hover:opacity-100 transition-opacity duration-200';
            langBtn.appendChild(img);
            
            document.getElementById('cookie-text').textContent = t.cookieText;
            document.getElementById('cookie-decline').textContent = t.cookieDecline;
            document.getElementById('cookie-accept').textContent = t.cookieAccept;

            // Impressum
            document.getElementById('sec-impressum-title').textContent = t.impressum.heading;
            document.getElementById('sec-impressum-sub').textContent = t.impressum.sub;
            document.getElementById('lbl-operator').textContent = t.impressum.operatorLabel;
            document.getElementById('lbl-court').textContent = t.impressum.courtLabel;
            document.getElementById('lbl-contact').textContent = t.impressum.contactLabel;

            // Privacy Policy
            document.getElementById('sec-privacy-title').textContent = t.privacy.heading;
            document.getElementById('privacy-content').innerHTML = t.privacy.sections.map(s => `
                <div>
                    <h3 class="text-white font-bold text-sm sm:text-base mb-1">${s.title}</h3>
                    <p class="text-zinc-400 text-xs sm:text-sm">${s.body}</p>
                </div>
            `).join('');

            // Terms of Use
            document.getElementById('sec-terms-title').textContent = t.terms.heading;
            document.getElementById('terms-content').innerHTML = t.terms.sections.map(s => `
                <div>
                    <h3 class="text-white font-bold text-sm sm:text-base mb-1">${s.title}</h3>
                    <p class="text-zinc-400 text-xs sm:text-sm">${s.body}</p>
                </div>
            `).join('');
        }

        window.toggleLang = () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            localStorage.setItem('siteLang', currentLang);
            render();
        };

        const cookieBanner = document.getElementById('cookie-banner');
        const cookieConsent = localStorage.getItem('siteCookieConsent');

        function injectGA() {
            if (document.getElementById('ga-script')) return;
            const script1 = document.createElement('script');
            script1.id = 'ga-script';
            script1.async = true;
            script1.src = 'https://www.googletagmanager.com/gtag/js?id=G-0WHX0WMFTC';
            document.head.appendChild(script1);

            const script2 = document.createElement('script');
            script2.innerHTML = `
                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-0WHX0WMFTC');
            `;
            document.head.appendChild(script2);
        }

        if (!cookieConsent) {
            cookieBanner.classList.remove('hidden');
        } else if (cookieConsent === 'granted') {
            injectGA();
        }

        window.handleCookie = (status) => {
            localStorage.setItem('siteCookieConsent', status);
            cookieBanner.classList.add('opacity-0', 'translate-y-full');
            setTimeout(() => cookieBanner.classList.add('hidden'), 400);
            if (status === 'granted') injectGA();
        };

        render();
    </script>
</body>
</html>
